name: Build macOS app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --windowed --noconfirm --name "Транскрибатор" transcriber.py
      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "Транскрибатор.app" ../Transkribator-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Transkribator-mac
          path: Transkribator-mac.zip
