name: Build apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --noconfirm --name "Транскрибатор" transcriber.py
          if [ "$(uname -m)" = "x86_64" ]; then N=Transkribator-mac-intel.zip; else N=Transkribator-mac.zip; fi
          cd dist && ditto -c -k --keepParent "Транскрибатор.app" "../$N"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --windowed --noconfirm --name Transkribator transcriber.py
          Compress-Archive -Path dist\Transkribator -DestinationPath Transkribator-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: Transkribator-*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "Транскрибатор (Mac и Windows)" \
            --notes "Mac M1 и новее: Transkribator-mac.zip. Mac на Intel (старые): Transkribator-mac-intel.zip. Windows: Transkribator-windows.zip."
